services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # kok_owner cuma buat init container (superuser DB) — BUKAN role
      # aplikasi. Nama "kok_app"/"kok_migrate" dipakai role tunduk-RLS yang
      # dibuat db-init/01-roles.sh; kalau POSTGRES_USER dipakai nama itu,
      # role itu jadi pemilik tabel dan RLS terlewati diam-diam (§6.2).
      - POSTGRES_USER=kok_owner
      - POSTGRES_PASSWORD=${POSTGRES_OWNER_PASSWORD:-kok_owner_dev_only}
      - POSTGRES_DB=kok_v3
      - KOK_MIGRATE_PASSWORD=${KOK_MIGRATE_PASSWORD:-kok_migrate_dev_only}
      - KOK_APP_PASSWORD=${KOK_APP_PASSWORD:-kok_app_dev_only}
    ports:
      # dipetakan ke host cuma buat dev lokal (psql/goose dari luar
      # container); prod tidak perlu expose ini.
      - "127.0.0.1:5434:5432"
    volumes:
      - kok_v3_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kok_owner -d kok_v3"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-off: `docker compose --profile tools run --rm migrate`. Jalan
  # sebagai kok_migrate (BYPASSRLS) — bukan role aplikasi.
  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MIGRATE_DATABASE_URL=postgresql://kok_migrate:${KOK_MIGRATE_PASSWORD:-kok_migrate_dev_only}@db:5432/kok_v3

  # One-off, F10 (§14, cutover): `docker compose --profile tools run --rm
  # migrate-v2 dedupe --v2-dsn=... --write-template /tmp/mapping.json`
  # lalu `... run migrate-v2 run --v2-dsn=... --v3-dsn=... --slug=... ...`
  # (v2-dsn arahkan ke DB v2 sungguhan, BUKAN service di compose ini — v2
  # jalan di stack terpisah, tidak pernah disentuh selain dibaca).
  migrate-v2:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate-v2
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://kok_app:${KOK_APP_PASSWORD:-kok_app_dev_only}@db:5432/kok_v3

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # WAJIB eksplisit — Dockerfile punya stage SETELAH `final` (migrate-v2,
      # sync-v2), jadi "stage terakhir di file" (default docker build tanpa
      # --target) BUKAN LAGI `final`. Tanpa baris ini, `api` diam-diam
      # kebangun jadi image sync-v2 (ketauan dari kejadian nyata pas deploy
      # manual pertama kali — container jalan tapi ENTRYPOINT-nya sync-v2,
      # bukan api, gak ada tanda di build log kalau gak dicek).
      target: final
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://kok_app:${KOK_APP_PASSWORD:-kok_app_dev_only}@db:5432/kok_v3
      - PORT=8300
      - ENV=${ENV:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8300:8300"

  # PERSISTEN (beda dari `migrate-v2` di atas yang sekali jalan) — v2 & v3
  # jalan BERSAMAAN sampai Ryan bilang pindah (PLAN.md §14 F10 "sync
  # hidup"), proses ini yang menjaga v3 tetap cermin dari v2 setiap
  # --interval. Di bawah `profiles: sync-v2` SENGAJA — service ini OPT-IN
  # (`docker compose --profile sync-v2 up -d`), supaya `docker compose up`
  # biasa (db+api saja) tidak pernah gagal gara-gara env var sync ini
  # belum diisi. Matikan (`docker compose stop sync-v2` atau lepas
  # profile-nya dari perintah up) begitu cutover sungguhan diputuskan.
  #
  # SYNC_V2_DATABASE_URL wajib diisi di .env sebelum dipakai (validasi
  # ADA, tapi di level aplikasi — cmd/sync-v2/main.go, bukan di compose
  # ini, supaya `--profile sync-v2` tetap gagal JELAS kalau lupa isi,
  # bukan bikin seluruh `docker compose up` ikut gagal parse). Menunjuk
  # ke stack v2 ASLI (v2 jalan terpisah, network_mode: host, lihat
  # v2/docker-compose.yml), BUKAN service di compose ini. Disarankan role
  # Postgres READ-ONLY di sisi v2 khusus buat ini (sync cuma pernah
  # SELECT, lihat README.md).
  sync-v2:
    profiles: ["sync-v2"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: sync-v2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - V2_DATABASE_URL=${SYNC_V2_DATABASE_URL:-}
      - DATABASE_URL=postgresql://kok_app:${KOK_APP_PASSWORD:-kok_app_dev_only}@db:5432/kok_v3
      - SYNC_V2_CLUB_SLUG=${SYNC_V2_CLUB_SLUG:-}
      - SYNC_V2_CLUB_NAME=${SYNC_V2_CLUB_NAME:-}
      - SYNC_V2_ADMIN=${SYNC_V2_ADMIN:-}
      - SYNC_V2_TIMEZONE=${SYNC_V2_TIMEZONE:-Asia/Jakarta}
      - SYNC_V2_MAPPING=/data/mapping.json
      - SYNC_V2_INTERVAL=${SYNC_V2_INTERVAL:-60s}
    volumes:
      # berkas pemetaan nama (hasil `migrate-v2 dedupe --write-template`,
      # sudah diedit manual) — di-mount, BUKAN dibangun ke image, supaya
      # bisa diedit operator sambil proses jalan tanpa rebuild (sync-v2
      # muat ulang tiap putaran, lihat cmd/sync-v2/main.go).
      - ./mapping.json:/data/mapping.json:ro

volumes:
  kok_v3_pgdata:
