<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline — Kok Badminton</title>
		<!--
			Fallback statis murni (PLAN.md §14 F5 "halaman offline & error") —
			dipakai sw.js cuma kalau rute yang dibuka BELUM PERNAH kesimpan di
			cache sama sekali (mis. buka langsung /main pertama kali pas offline).
			Kalau shell app sudah pernah tercache, sw.js balikin index.html biasa
			dan SvelteKit yang urus tampilan — halaman ini tidak akan kelihatan.
			Sengaja tanpa JS/font eksternal, harus jalan tanpa koneksi sama sekali.
		-->
		<style>
			:root {
				color-scheme: light dark;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				background: #f4f5f7;
				color: #10141c;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0b0e14;
					color: #f0f2f6;
				}
				p {
					color: #aab3c2 !important;
				}
			}
			.card {
				max-width: 320px;
				text-align: center;
			}
			h1 {
				font-size: 20px;
				font-weight: 800;
				margin: 0 0 8px;
			}
			p {
				font-size: 14px;
				color: #4a5464;
				line-height: 1.55;
				margin: 0 0 22px;
			}
			button {
				font: inherit;
				font-weight: 700;
				font-size: 14px;
				padding: 10px 22px;
				border-radius: 999px;
				border: 0;
				background: #1447e6;
				color: #fff;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<h1>Lagi offline</h1>
			<p>
				Halaman ini belum pernah dibuka jadi belum tersimpan buat mode pesawat. Sambungin
				internet dulu, atau buka halaman yang sudah pernah dikunjungi.
			</p>
			<button onclick="location.reload()">Coba lagi</button>
		</div>
	</body>
</html>
