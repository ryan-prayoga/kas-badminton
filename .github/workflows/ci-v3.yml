name: CI kas-badminton v3

on:
  push:
    branches: [main]
    paths:
      - "v3/**"
      - ".github/workflows/ci-v3.yml"
  pull_request:
    paths:
      - "v3/**"
      - ".github/workflows/ci-v3.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/server
    # kok_migrate/kok_app dibuat via deploy/db-init/01-roles.sh (langkah
    # "Bootstrap role" di bawah) — bukan lewat POSTGRES_USER service ini,
    # supaya prosedurnya identik dengan dev (docker-compose) dan produksi.
    # POSTGRES_USER di sini cuma admin bootstrap, sama seperti kok_owner
    # di compose (PLAN.md §6.2: aplikasi TIDAK BOLEH memakai pemilik tabel).
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGPASSWORD: postgres_ci
      POSTGRES_USER: postgres
      POSTGRES_DB: kok_v3
      KOK_MIGRATE_PASSWORD: kok_migrate_ci
      KOK_APP_PASSWORD: kok_app_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: kok_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: v3/server/go.mod
          cache-dependency-path: v3/server/go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "Berkas belum di-gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Bootstrap role + migrasi: langkah yang sama persis dengan dev
      # (docker-compose) — lihat v3/deploy/db-init/01-roles.sh dan
      # v3/server/internal/migrations/README.md. Role dibuat SEBELUM
      # migrasi 00002_roles.sql jalan (yang jadi no-op idempoten di sini).
      - name: Bootstrap role kok_app/kok_migrate
        run: ../deploy/db-init/01-roles.sh

      - name: Migrasi skema (role kok_migrate)
        env:
          MIGRATE_DATABASE_URL: postgresql://kok_migrate:${{ env.KOK_MIGRATE_PASSWORD }}@localhost:5432/kok_v3?sslmode=disable
        run: go run ./cmd/migrate

      # Suite kebocoran antar-klub, idempotensi, versi, dan realtime SSE
      # (internal/http, internal/store, PLAN.md §14 F2 "selesai kalau")
      # butuh Postgres sungguhan — TEST_DATABASE_URL memicunya, bukan skip.
      - name: go test
        env:
          TEST_DATABASE_URL: postgresql://kok_app:${{ env.KOK_APP_PASSWORD }}@localhost:5432/kok_v3?sslmode=disable
        run: go test ./... -race -count=1

      - name: go build
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v3/web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: svelte-check (lint tipe)
        run: npm run check

      - name: Build
        run: npm run build
